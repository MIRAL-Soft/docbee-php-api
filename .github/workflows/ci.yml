name: CI

on:
  push:
    branches: [main, DocbeeAPIv2]
  pull_request:
    branches: [main, DocbeeAPIv2]

jobs:
  test:
    name: Tests & Static Analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # composer.lock is intentionally gitignored (this is a library), so there is
      # nothing to validate a lock against and `composer install` would have no lock.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Unit suite only — fully offline/mocked. Integration tests are env-gated
      # (DOCBEE_TENANT / DOCBEE_TOKEN) and skip themselves; they are deliberately
      # NOT run here to avoid putting live credentials into CI.
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite Unit

      # Level 8, no baseline — see phpstan.neon. New type errors fail the build.
      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --no-progress
